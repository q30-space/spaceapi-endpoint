name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
        
    - name: Install dependencies
      run: go mod download
      
    - name: Run tests
      run: go test -v ./internal/... ./cmd/...
      
    - name: Run tests with coverage
      run: go test -cover ./internal/... ./cmd/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
        
    - name: Build spaceapi
      run: go build -o bin/spaceapi ./cmd/spaceapi
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: bin/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
        
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  license-check:
    name: License Headers Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check license headers
      run: ./scripts/check-license-headers.sh

  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate OpenAPI specification
      run: |
        docker run --rm -v ${{ github.workspace }}:/spec \
          openapitools/openapi-generator-cli validate -i /spec/openapi.yaml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true
        
    - name: Install Gosec
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@latest
        
    - name: Run Gosec Security Scanner
      run: |
        gosec -no-fail -fmt sarif -out gosec.sarif ./... || echo "Gosec scan completed with findings"
      continue-on-error: true
        
    - name: Verify SARIF file exists
      run: |
        if [ -f gosec.sarif ]; then
          echo "✓ SARIF file created successfully"
          cat gosec.sarif | head -20
        else
          echo "⚠ SARIF file not found, creating empty report"
          echo '{"version":"2.1.0","runs":[]}' > gosec.sarif
        fi
        
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: gosec.sarif
      continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build, lint, license-check, openapi-validate]
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.spaceapi
        push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  e2e-test:
    name: End-to-End API Tests
    runs-on: ubuntu-latest
    needs: [test, build, lint, license-check, openapi-validate]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Schemathesis
      run: |
        pip install schemathesis requests
        
    - name: Prepare test configuration
      run: |
        # Use example config for testing
        cp spaceapi.json.example spaceapi.json
        
    - name: Build and start Docker container
      env:
        SPACEAPI_AUTH_KEY: test-api-key-for-ci
      run: |
        docker compose up -d
        
    - name: Wait for service to be healthy
      run: |
        echo "Waiting for service to be ready..."
        timeout 60 sh -c 'until docker compose ps | grep -q "healthy"; do sleep 2; done'
        echo "Service is ready!"
        
    - name: Verify service is responding
      run: |
        curl -f http://localhost:8089/health || (docker compose logs && exit 1)
        curl -f http://localhost:8089/ || (docker compose logs && exit 1)
        
    - name: Run OpenAPI conformance tests (public endpoints)
      run: |
        echo "Testing public endpoints against OpenAPI spec..."
        schemathesis run openapi.yaml \
          --url http://localhost:8089 \
          --checks all \
          --workers 4 \
          --include-path-regex "^/(health|api/space)$" \
          --exclude-path-regex ".*/(state|people|event)$" \
          || (docker compose logs && exit 1)
          
    - name: Run OpenAPI conformance tests (protected endpoints)
      env:
        SPACEAPI_AUTH_KEY: test-api-key-for-ci
      run: |
        echo "Testing protected endpoints against OpenAPI spec..."
        schemathesis run openapi.yaml \
          --url http://localhost:8089 \
          --header "X-API-Key: ${SPACEAPI_AUTH_KEY}" \
          --checks all \
          --workers 4 \
          --include-path-regex ".*/(state|people|event)$" \
          || (docker compose logs && exit 1)
          
    - name: Test authentication error cases
      run: |
        echo "Testing authentication failures..."
        # Test missing API key (should return 401)
        response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8089/api/space/state \
          -H "Content-Type: application/json" \
          -d '{"open": true}')
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" != "401" ]; then
          echo "Expected 401 for missing API key, got $http_code"
          docker compose logs
          exit 1
        fi
        
        # Test invalid API key (should return 401)
        response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8089/api/space/state \
          -H "Content-Type: application/json" \
          -H "X-API-Key: invalid-key" \
          -d '{"open": true}')
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" != "401" ]; then
          echo "Expected 401 for invalid API key, got $http_code"
          docker compose logs
          exit 1
        fi
        
        echo "Authentication tests passed!"
        
    - name: Test successful API operations
      env:
        SPACEAPI_AUTH_KEY: test-api-key-for-ci
      run: |
        echo "Testing successful state update..."
        response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8089/api/space/state \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${SPACEAPI_AUTH_KEY}" \
          -d '{"open": true, "message": "CI Test", "trigger_person": "CI Bot"}')
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" != "200" ]; then
          echo "Expected 200 for valid state update, got $http_code"
          docker compose logs
          exit 1
        fi
        
        echo "Testing successful people count update..."
        response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8089/api/space/people \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${SPACEAPI_AUTH_KEY}" \
          -d '{"value": 5, "location": "Main Space"}')
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" != "200" ]; then
          echo "Expected 200 for valid people count update, got $http_code"
          docker compose logs
          exit 1
        fi
        
        echo "Testing successful event creation..."
        response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8089/api/space/event \
          -H "Content-Type: application/json" \
          -H "X-API-Key: ${SPACEAPI_AUTH_KEY}" \
          -d '{"name": "CI Bot", "type": "check-in", "extra": "Running E2E tests"}')
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" != "200" ]; then
          echo "Expected 200 for valid event creation, got $http_code"
          docker compose logs
          exit 1
        fi
        
        echo "API operation tests passed!"
        
    - name: Verify updated data in API response
      run: |
        echo "Verifying data was persisted..."
        response=$(curl -s http://localhost:8089/api/space)
        
        # Check if state was updated
        if ! echo "$response" | grep -q '"open":true'; then
          echo "State update not reflected in API response"
          echo "$response"
          exit 1
        fi
        
        # Check if people count was updated
        if ! echo "$response" | grep -q '"value":5'; then
          echo "People count update not reflected in API response"
          echo "$response"
          exit 1
        fi
        
        echo "Data persistence verified!"
        
    - name: Show container logs
      if: always()
      run: |
        echo "=== Container Logs ==="
        docker compose logs
        
    - name: Cleanup
      if: always()
      run: |
        docker compose down -v